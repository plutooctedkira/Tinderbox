<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>记忆库</title>
<style>
:root{--bg:#F5F0DF;--nav:#FEDDDF;--card:#FFF;--border:#e0d8c8;--text:#2c2416;--muted:#8c8068;--accent:#EFA5B5}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{background:var(--nav);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:18px;color:#f8f5ed}
.layout{display:flex;flex:1;min-height:0}
.logo{margin:0;line-height:0}.logo img{height:88px;width:auto;display:block;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(1.5px 1.5px 0 #fff) drop-shadow(-1.5px 1.5px 0 #fff) drop-shadow(1.5px -1.5px 0 #fff) drop-shadow(-1.5px -1.5px 0 #fff) drop-shadow(2px 3px 3px rgba(0,0,0,.28))}.logo.txt{line-height:1.2}.logo.txt::after{content:'记忆库';font-size:40px}.sidebar{width:200px;background:var(--nav);padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
.sidebar .section-title{font-size:10px;color:#6a8ab0;padding:6px 12px 2px}
.sidebar button{background:transparent;color:#7a5560;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;text-align:left;font-size:12px}
.sidebar button:hover,.sidebar button.active{background:var(--accent);color:var(--text,#2c2416)}
.sidebar .stats{margin-top:auto;font-size:10px;color:#8a9ab8;padding:6px 12px}
main{flex:1;padding:20px;overflow-y:auto}
.search-bar{display:flex;gap:10px;margin-bottom:16px}.search-bar>input{box-shadow:0 0 0 4px var(--bg,#fff)}.search-bar>button{box-shadow:0 0 0 4px var(--bg,#fff),3px 3px 0 var(--text,#2c2416)}.search-bar>button:hover{box-shadow:0 0 0 4px var(--bg,#fff),4px 4px 0 var(--text,#2c2416)}.search-bar>button:active{box-shadow:0 0 0 4px var(--bg,#fff)}.search-bar>label{box-shadow:0 0 0 4px var(--bg,#fff);background:var(--bg,#fff);border-radius:4px}
.search-bar input{flex:1;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.btn{padding:10px 18px;background:var(--accent);color:var(--text,#2c2416);border:1.5px solid var(--text,#2c2416);border-radius:8px;cursor:pointer;font-size:13px;box-shadow:3px 3px 0 var(--text,#2c2416);transition:transform .06s ease,box-shadow .06s ease}.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--text,#2c2416)}.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--text,#2c2416)}
.btn:hover{background:#E88DA1}.btn-sm{padding:4px 10px;font-size:11px;box-shadow:2px 2px 0 var(--text,#2c2416)}.btn-sm:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--text,#2c2416)}.btn-sm:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text,#2c2416)}
.btn-outline{padding:6px 14px;background:var(--card,#fff);color:var(--accent);border:1.5px solid var(--text,#2c2416);border-radius:6px;cursor:pointer;font-size:12px;margin:2px;box-shadow:3px 3px 0 var(--text,#2c2416);transition:transform .06s ease,box-shadow .06s ease}.btn-outline:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--text,#2c2416)}.btn-outline:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--text,#2c2416)}
.grid{display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer}
.card:hover{border-color:var(--accent)}.card .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff}.vol{display:flex;gap:3px;flex:1;cursor:pointer}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 12px}.dash2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}.dash2>*{min-width:0}.dash2 .dash-content{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dash2 .dash-row{gap:10px}.dash2 .dash-list,.dash2 .dash-list-header{overflow:hidden}@media(max-width:900px){.dash2{grid-template-columns:1fr}}.infocard{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px;background:var(--bg,#fafafa)}.infocard div{display:block;text-align:left;font-size:12.5px;color:var(--muted);padding:3px 0}.infocard div:not(:last-child){border-bottom:1px solid var(--border)}.infocard b{font-weight:600;color:var(--text,#333);margin-left:6px}.sidepanel{background:var(--card,#fff);border:1px solid var(--border);border-radius:14px;padding:16px;position:sticky;top:0;max-height:calc(100vh - 28px);overflow-y:auto}@media(max-width:900px){.sidepanel{position:static;max-height:none}}.sidepanel h4{margin:0 0 12px;font-size:14px}.sp-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}.sp-row:last-child{border-bottom:none}.sp-row i{font-style:normal;color:var(--muted)}.sp-row b{font-weight:600;font-size:15px}.sp-sub{margin:14px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em}.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent,#4a7fd4);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.22);z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .12s}.fab:hover{transform:scale(1.07)}.fab:active{transform:scale(.95)}.tabs b{font-weight:500;font-size:12.5px;padding:4px 11px;border-radius:14px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent;transition:all .12s}.tabs b:hover{border-color:#a9b4c4}.tabs b.sel{background:var(--accent,#4a7fd4);border-color:var(--accent,#4a7fd4);color:#fff}.tabs b s{text-decoration:none;opacity:.65;margin-left:4px}.vol i{flex:1;height:14px;border-radius:2px;background:var(--border);transition:background .12s;font-style:normal}.vol i:hover{background:#c8d0dc}.vol i.on{background:var(--accent,#4a7fd4)}.vol i.done{background:#3aaf6b}
.bp{background:var(--accent)}.bt{background:#d4890a}.bd{background:#b91c1c}.bk{background:#1e6f9e}.bf{background:#a21caf}.bh{background:#15803d}.bm{background:#b8860b}.bl{background:#6b7280}.bdi{background:#8b5cf6}.bde{background:#0891b2}.bpin{background:var(--accent)}
.card .ct{font-size:14px;line-height:1.7;white-space:pre-wrap;max-height:100px;overflow:hidden}
.card .meta{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--muted)}
.form-actions{display:flex;gap:10px;margin-top:18px}.form-actions button{margin:0;padding:7px 16px;font-size:12px;line-height:1.25;border-radius:7px;box-shadow:2px 2px 0 var(--text,#2c2416)}.form-actions button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--text,#2c2416)}.form-actions button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text,#2c2416)}.add-form textarea{width:100%;min-height:80px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;resize:vertical;outline:none;font-family:inherit}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row select,.row input{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--accent)}.stat-card .label{font-size:11px;color:var(--muted);margin-top:2px}
.dash-header h3{font-size:15px;color:var(--text);margin:0 0 10px 0}
.dash-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:13vh;min-height:90px}
.dash-card{background:#fff;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dash-card.clickable{cursor:pointer}.dash-card.clickable:hover{border-color:var(--accent)}
.dash-num{font-size:32px;font-weight:800;color:var(--accent)}.dash-label{font-size:11px;color:var(--muted);margin-top:2px}
.dash-list-header>span:not(:first-child){text-align:center}.dash-list-header{display:flex;gap:10px;padding:8px 12px;font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.dash-list{display:flex;flex-direction:column;gap:6px}
.dash-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:13px}
.dash-content{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-cat{width:100px;flex:none;display:flex;justify-content:center}.dash-act{width:70px;flex:none;display:flex;justify-content:center}.dash-weight{width:70px;flex:none;text-align:center;color:var(--muted);font-family:monospace}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.on{display:flex}
.modal{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;max-width:400px;width:92%;max-height:80vh;overflow-y:auto;position:relative}
.modal .cf{white-space:pre-wrap;line-height:1.7;margin:10px 0}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.close-btn{position:sticky;top:0;float:right;z-index:6;background:#fff;border:none;color:var(--muted);font-size:22px;cursor:pointer;width:30px;height:30px;line-height:1;border-radius:50%;margin:-4px -4px 0 0}.close-btn:hover{background:var(--bg,#f2f2f2);color:var(--text,#333)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px}
.conflict-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;align-items:center;justify-content:center}
.conflict-overlay.on{display:flex}
.conflict-pop{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:20px;max-width:510px;width:94%;max-height:80vh;overflow-y:auto}
.conflict-pop h3{color:var(--accent);margin-bottom:14px}
.conflict-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.conflict-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--bg)}
.conflict-card .c-label{font-size:11px;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.conflict-card .c-label.old{color:var(--muted)}.conflict-card .c-label.new{color:var(--accent)}
.conflict-card .c-body{font-size:13px;line-height:1.6;max-height:140px;overflow-y:auto}
.batch-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--accent);color:#fff;border-radius:8px;margin-bottom:12px;font-size:12px}.batch-bar button{background:#fff;color:var(--accent);border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px}.chk-cell{width:30px;flex-shrink:0;text-align:center}.dot-menu{position:relative;display:inline-block}.dot-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}.dot-dropdown{display:none;position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:50;min-width:80px}.dot-dropdown.show{display:block}.dot-dropdown button{display:block;width:100%;padding:8px 14px;background:none;border:none;text-align:left;cursor:pointer;font-size:12px;color:var(--text)}.dot-dropdown button:hover{background:var(--bg)}.flag-row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card,#fff);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;max-width:640px}
.flag-name{font-size:14px;font-weight:600;font-family:monospace}
.flag-desc{font-size:12px;color:var(--muted);margin-top:3px}
.switch{position:relative;display:inline-block;width:46px;height:25px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#c9c2b2;border-radius:25px;transition:.2s}
.slider:before{position:absolute;content:'';height:19px;width:19px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(21px)}
</style>
<body>
<header><h1 class=logo><img src="logo.png" alt="记忆库" onerror="this.style.display='none';this.parentNode.classList.add('txt')"></h1></header>
<div class="layout">
<aside class="sidebar">
<div class="section-title">概览</div>
<button class="active" onclick="switchTab('dashboard',this)">仪表盘</button>
<button onclick="switchTab('all',this)">全部记忆</button>

<div class="section-title">日记 & 计划</div>
<button onclick="switchTab('diary',this)">日记</button>
<button onclick="switchTab('plans',this)">计划</button>
<button onclick="switchTab('devlogs',this)">开发日志</button>
<div class="section-title">管理</div>
<button onclick="switchTab('archived',this)">归档记忆</button>
<button onclick="switchTab('flags',this)">功能开关</button>

<div class="stats" id="sbar">...</div>
</aside>
<main id="main"><div class="empty">加载中...</div></main>
</div>
<div class="modal-overlay" id="mo" onclick="closeModalOuter(event)"><div class="modal" id="mc" onclick="event.stopPropagation()"></div></div>
<div class="conflict-overlay" id="co" onclick="closeConflict()"><div class="conflict-pop" id="cp" onclick="event.stopPropagation()"></div></div>
<script>
var API='',currentTab='dashboard',detailId=null;
var CN={knowledge:'知识',task:'任务',decision:'决策',preference:'偏好',fiction_inspiration:'小说灵感',diary:'日记',dev_log:'开发日志'};
var FN={high:'高',medium:'中',low:'低'},SN={active:'活跃',completed:'已完成',archived:'已归档',superseded:'已取代',pending_merge:'待合并'};
var PT={'plan-life':'生活','plan-work':'工作','plan-dev':'开发'};
function api(p){return fetch(API+'/api'+p).then(function(r){return r.json()})}
function post(p,d){return fetch(API+'/api'+p,{method:'POST',body:JSON.stringify(d||{}),headers:{'Content-Type':'application/json'}}).then(function(r){return r.json()})}
function switchTab(tab,btn){currentTab=tab;var _f=document.getElementById('fab');if(_f&&tab!=='all')_f.remove();var bs=document.querySelectorAll('.sidebar button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');if(btn)btn.classList.add('active');if(tab==='dashboard')showDashboard();else if(tab==='all')loadAll();else if(tab==='search')showSearch();else if(tab==='add')showAddForm();else if(tab==='diary')showDiary();else if(tab==='plans')showPlans();else if(tab==='devlogs')showDevLogs();else if(tab==='archived')showArchived();else if(tab==='flags')showFlags();else if(tab==='stats')loadStats();}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function closeModal(){document.getElementById('mo').classList.remove('on')}
function closeModalOuter(e){if(e.target===document.getElementById('mo'))closeModal()}
function fillDashStats(){api('/stats').then(function(d){var el=document.getElementById('dashStats');if(!el)return;var h='<h4>数据统计</h4>';h+='<div class=sp-row><i>总计</i><b>'+d.total+'</b></div>';h+='<div class=sp-row><i>活跃</i><b>'+d.active+'</b></div>';h+='<div class=sp-row><i>已归档</i><b>'+d.archived+'</b></div>';h+='<div class=sp-row><i>已取代</i><b>'+d.superseded+'</b></div>';h+='<div class=sp-row><i>平均权重</i><b>'+d.avg_weight+'</b></div>';h+='<div class=sp-row><i>审计日志</i><b>'+d.logs_total+'</b></div>';h+='<div class=sp-sub>按分类</div>';for(var k in d.by_category)h+='<div class=sp-row><i>'+(CN[k]||k)+'</i><b>'+d.by_category[k]+'</b></div>';el.innerHTML=h})}
function showDashboard(){
    api('/dashboard').then(function(d){
        api('/conflicts').then(function(cf){
            var cc=cf.conflicts?cf.conflicts.length:0,rh='';
            for(var i=0;i<d.recent.length;i++){var r=d.recent[i];rh+='<div class=dash-row><div class=dash-content>'+esc(r.content)+'</div><span class=dash-cat><span class="badge b'+r.category[0]+'">'+(CN[r.category]||r.category)+'</span></span><span class=dash-weight>'+r.weight.toFixed(2)+'</span><span class=dash-act><button class="btn btn-sm" onclick="showDetail(\''+r.entry_id+'\')">查看</button></span></div>';}
            document.getElementById('main').innerHTML='<div class=dash2><div><div class=dash-header><h3>今日记忆概览</h3></div><div class=dash-top><div class="dash-card clickable" onclick="showActivePop()"><div class=dash-num>'+d.active+'</div><div class=dash-label>活跃记忆</div></div><div class="dash-card clickable" onclick="showTodayPop()"><div class=dash-num>'+d.today+'</div><div class=dash-label>今日新增</div></div><div class="dash-card clickable" onclick="openConflictPop()"><div class=dash-num>'+cc+'</div><div class=dash-label>待处理冲突</div></div></div><h3 style=margin:20px 0 12px>最近活动</h3><div class=dash-list-header><span style=flex:1>内容</span><span style=width:100px>分类</span><span style=width:70px>权重</span><span style=width:70px></span></div><div class=dash-list>'+(rh||'<div class=empty>暂无记录</div>')+'</div></div><div id=dashStats class=sidepanel><h4>数据统计</h4><div style=color:var(--muted);font-size:12px>加载中…</div></div></div>';fillDashStats();
        });
    });
}
showDashboard();
api('/stats').then(function(d){document.getElementById('sbar').innerText='共 '+d.total+' 条 | 活跃 '+d.active});
function loadAll(){api('/all').then(function(d){var h='<div class=search-bar style=position:sticky;top:0;padding:6px 0;z-index:10><input id=sq placeholder="搜索记忆..." onkeydown="if(event.key===\'Enter\')doSearchFromAll()"><button class=btn onclick=doSearchFromAll()>搜索</button><label style=font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer><input type=checkbox id=ia> 含归档</label></div><div id=allTabs></div><div id=allContent></div>';document.getElementById('main').innerHTML=h;allData=d.memories||[];renderAll()})}
var allData=[],allFilter='';
function renderAll(){var groups={};for(var i=0;i<allData.length;i++){var k=key(allData[i]);groups[k]=(groups[k]||0)+1}var order=['','knowledge','dev_log','fiction_inspiration','decision','preference','diary','task'];var t='<div class=tabs>';for(var o=0;o<order.length;o++){var k=order[o];var cnt=k===''?allData.length:(groups[k]||0);if(k!==''&&!cnt)continue;var lb=k===''?'全部':(CN[k]||k);t+='<b class="'+(allFilter===k?'sel':'')+'" onclick="allFilter=\''+k+'\';renderAll()">'+lb+'<s>'+cnt+'</s></b>'}t+='</div>';document.getElementById('allTabs').innerHTML=t;var list=allFilter?allData.filter(function(m){return key(m)===allFilter}):allData;var h=list.length?'<div class=grid>'+list.map(renderCard).join('')+'</div>':'<div class=empty>这一类还没有记忆</div>';document.getElementById('allContent').innerHTML=h;if(!document.getElementById('fab')){var f=document.createElement('button');f.id='fab';f.className='fab';f.title='添加记忆';f.textContent='+';f.onclick=showAddForm;document.body.appendChild(f)}}
function key(m){return m.type==='dev_log'?'dev_log':m.category}
function doSearchFromAll(){var q=document.getElementById('sq').value.trim();api('/search?q='+encodeURIComponent(q||'')+'&archive='+(document.getElementById('ia')||{}).checked).then(function(d){var div=document.getElementById('allContent');if(!q){loadAll();return}if(!d.results||!d.results.length){div.innerHTML='<div class=empty>未找到</div>';return}var h='<div class=grid>';for(var i=0;i<d.results.length;i++){var r=d.results[i];h+='<div class=card onclick="showDetail(\''+r.id+'\')"><div class=head><span class="badge b'+r.category[0]+'">'+(CN[r.category]||r.category)+'</span><span style=font-size:10px;color:#8899b0>'+r.id+'</span><span style=font-size:10px;color:var(--accent)>相关度:'+r.score+'</span></div><div class=ct>'+esc(r.content)+'</div></div>'}h+='</div>';div.innerHTML=h})}
function renderCard(m){var p=m.pin?' <span class="badge bpin">置顶</span>':'';return'<div class=card onclick="showDetail(\''+m.entry_id+'\')"><div class=head><span class="badge b'+m.category[0]+'">'+(CN[m.category]||m.category)+'</span><span class="badge b'+m.confidence[0]+'">'+(FN[m.confidence]||m.confidence)+'</span>'+p+'<span style=font-size:10px;color:#8899b0;font-family:monospace>'+m.entry_id+'</span></div><div class=ct>'+esc(m.content)+'</div><div class=meta><span>权重：'+m.weight.toFixed(2)+'</span><span>'+m.created_at+'</span></div></div>'}
function showSearch(){switchTab('all',document.querySelectorAll('.sidebar button')[1])}
function doSearch(){return}
function exitAddForm(){switchTab("all",null)}

function curveSVG(d){
var c=decayCurve(d),W=300,H=140,PB=26,PL=30,PR=14,XR=W-PR;
if(!d.decay_rate&&!c.marks.length)return '<div style="font-size:12px;color:var(--muted);padding:8px 0">'+
(d.pin||d.anchor?'\u5df2\u951a\u5b9a\uff0c\u6c38\u4e0d\u8870\u51cf':'\u8fd9\u4e00\u7c7b\u4e0d\u53c2\u4e0e\u8870\u51cf')+'</div>';
var x=function(i){return PL+i/c.days*(XR-PL)},y=function(w){return H-PB-w*(H-PB-10)};
var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;overflow:visible">';
[100,75,50,25,0].forEach(function(v){var yy=y(v/100);
g+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+XR+'" y2="'+yy.toFixed(1)+'" stroke="var(--border)" stroke-width="1"'+(v&&v<100?' stroke-dasharray="2 4"':'')+'/>';
g+='<text x="'+(PL-5)+'" y="'+(yy+3.5).toFixed(1)+'" font-size="9" fill="#8899b0" text-anchor="end">'+v+'</text>'});
var fy=y(d.floor||0.1);
g+='<line x1="'+PL+'" y1="'+fy.toFixed(1)+'" x2="'+XR+'" y2="'+fy.toFixed(1)+'" stroke="#d9534f" stroke-width="1" stroke-dasharray="4 3" opacity=".65"/>';
g+='<text x="'+XR+'" y="'+(fy-4).toFixed(1)+'" font-size="8.5" fill="#d9534f" text-anchor="end">\u5f52\u6863\u7ebf</text>';
var dd=c.pts.map(function(p,k){return (k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.w).toFixed(1)}).join(' ');
g+='<path d="'+dd+' L'+x(c.days).toFixed(1)+' '+(H-PB)+' L'+PL+' '+(H-PB)+' Z" fill="rgba(74,127,212,.10)"/>';
g+='<path d="'+dd+'" fill="none" stroke="#4a7fd4" stroke-width="2"/>';
c.marks.forEach(function(m){
g+='<circle cx="'+x(m.i).toFixed(1)+'" cy="'+y(m.w).toFixed(1)+'" r="3.5" fill="#fff" stroke="#3aaf6b" stroke-width="2"><title>\u547d\u4e2d +'+(0.1*m.n).toFixed(1)+'</title></circle>'});
var lastW=c.pts[c.pts.length-1].w;
g+='<circle cx="'+x(c.days).toFixed(1)+'" cy="'+y(lastW).toFixed(1)+'" r="3" fill="#4a7fd4"/>';
var sd=(d.created_at||'').slice(5,10);
g+='<text x="'+PL+'" y="'+(H-8)+'" font-size="9" fill="#8899b0">'+sd+'</text>';
g+='<text x="'+XR+'" y="'+(H-8)+'" font-size="9" fill="#8899b0" text-anchor="end">\u4eca\u5929</text>';
g+='<text x="'+((PL+XR)/2)+'" y="'+(H-8)+'" font-size="9" fill="#8899b0" text-anchor="middle">'+c.days+' \u5929</text>';
g+='</svg>';
var per=d.decay_rate?((1-d.decay_rate)*100).toFixed(0)+'%/\u5929':'\u4e0d\u8870\u51cf';
return g+'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">'+
'<span>\u8870\u51cf '+per+'</span><span>\u547d\u4e2d '+c.marks.length+' \u6b21</span>'+
'<span>\u6a21\u62df\u503c '+(lastW*100).toFixed(0)+'</span></div>'}
function decayCurve(d){
var DAY=86400000,now=Date.now();
var t0=Date.parse((d.created_at||'').replace(' ','T')+'Z')||now;
var days=Math.max(1,Math.min(400,Math.round((now-t0)/DAY)));
var hitDay={};(d.hits||[]).forEach(function(h){
var t=Date.parse(h.replace(' ','T')+'Z');if(t)hitDay[Math.round((t-t0)/DAY)]=(hitDay[Math.round((t-t0)/DAY)]||0)+1});
var w=1,pts=[],marks=[];
for(var i=0;i<=days;i++){
if(d.decay_rate&&i>0)w=Math.max(w*d.decay_rate,d.floor||0.1);
if(hitDay[i]){w=Math.min(w+(d.hit_boost||0.1)*hitDay[i],1);marks.push({i:i,w:w,n:hitDay[i]})}
pts.push({i:i,w:w})}
return{pts:pts,marks:marks,days:days}}

function openConflictPop(){api('/conflicts').then(function(d){if(!d.conflicts||!d.conflicts.length){document.getElementById('cp').innerHTML='<div style=text-align:center;padding:30px>暂无待处理冲突</div>'}else{var h='<h3>冲突处理 ('+d.conflicts.length+')</h3>';for(var i=0;i<d.conflicts.length;i++){var m=d.conflicts[i],old=m.old;h+='<div class=conflict-pair><div class=conflict-card><div class="c-label old">旧记忆'+(old?' ('+old.entry_id+')':'')+'</div><div class=c-body>'+esc(old?old.content:'(无)')+'</div>'+(old?'<div class=c-meta>'+old.created_at+'</div>':'')+'</div><div class=conflict-card><div class="c-label new">新记忆 ('+m.entry_id+')</div><div class=c-body>'+esc(m.content)+'</div><div class=c-meta>'+m.created_at+'</div></div></div><div class=conflict-acts><button class=btn onclick="resolveConflictPop(\''+m.entry_id+'\',\'keep\')">保留新记忆</button><button class=btn style=background:#1e6f9e onclick="resolveConflictPop(\''+m.entry_id+'\',\'merge\')">合并记忆</button><button class=btn-outline onclick="resolveConflictPop(\''+m.entry_id+'\',\'ignore\')">忽略冲突</button></div>';if(i<d.conflicts.length-1)h+='<hr style=border-color:var(--border);margin:10px 0>'}document.getElementById('cp').innerHTML=h}document.getElementById('co').classList.add('on')})}
function resolveConflictPop(id,action){var act=action==='keep'?'keep':(action==='ignore'?'archive':'keep');post('/resolve',{entry_id:id,action:act}).then(function(){document.getElementById('co').classList.remove('on');showDashboard()})}
function showActivePop(){api('/all').then(function(d){if(!d.memories||!d.memories.length){document.getElementById('cp').innerHTML='<div style=text-align:center;padding:30px>暂无活跃记忆</div>';document.getElementById('co').classList.add('on');return}var h='<h3>活跃记忆 ('+d.memories.length+')</h3><div class=grid>';for(var i=0;i<d.memories.length;i++){var m=d.memories[i];h+='<div class=card onclick="showDetail(\''+m.entry_id+'\')" style=cursor:pointer><div class=head><span class="badge b'+m.category[0]+'">'+(CN[m.category]||m.category)+'</span><span class="badge b'+m.confidence[0]+'">'+(FN[m.confidence]||m.confidence)+'</span>'+(m.pin?'<span class="badge bpin">置顶</span>':'')+'<span style=font-size:10px;color:#8899b0;font-family:monospace>'+m.entry_id+'</span></div><div class=ct>'+esc(m.content)+'</div><div class=meta><span>权重：'+m.weight.toFixed(2)+'</span><span>'+m.created_at+'</span></div></div>'}h+='</div>';document.getElementById('cp').innerHTML=h;document.getElementById('co').classList.add('on')})}
function showTodayPop(){api('/all').then(function(d){var today=new Date().toISOString().slice(0,10);var tm=[];for(var i=0;i<d.memories.length;i++){if(d.memories[i].created_at>=today)tm.push(d.memories[i])}if(!tm.length){document.getElementById('cp').innerHTML='<div style=text-align:center;padding:30px>今日暂无新增</div>';document.getElementById('co').classList.add('on');return}var h='<h3>今日新增 ('+tm.length+')</h3><div class=grid>';for(var i=0;i<tm.length;i++){var m=tm[i];h+='<div class=card onclick="showDetail(\''+m.entry_id+'\')" style=cursor:pointer><div class=head><span class="badge b'+m.category[0]+'">'+(CN[m.category]||m.category)+'</span><span class="badge b'+m.confidence[0]+'">'+(FN[m.confidence]||m.confidence)+'</span>'+(m.pin?'<span class="badge bpin">置顶</span>':'')+'<span style=font-size:10px;color:#8899b0;font-family:monospace>'+m.entry_id+'</span></div><div class=ct>'+esc(m.content)+'</div><div class=meta><span>权重：'+m.weight.toFixed(2)+'</span><span>'+m.created_at+'</span></div></div>'}h+='</div>';document.getElementById('cp').innerHTML=h;document.getElementById('co').classList.add('on')})}
function closeConflict(){document.getElementById('co').classList.remove('on')}
function showFlags(){api('/config').then(function(d){var flags=d.flags||[];var h='<div class="dash-header"><h3>功能开关</h3></div><p style="color:var(--muted);font-size:12px;margin-bottom:14px">控制各功能模块的启用/停用，改动即时生效。</p>';if(!flags.length)h+='<div class="empty">暂无开关</div>';for(var i=0;i<flags.length;i++){var f=flags[i],on=f.value==='true';h+='<div class="flag-row"><div><div class="flag-name">'+esc(f.key)+'</div><div class="flag-desc">'+esc(f.description||'')+'</div></div><label class="switch"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleFlag(\''+f.key+'\',this.checked)"><span class="slider"></span></label></div>'}document.getElementById('main').innerHTML=h})}
function toggleFlag(key,on){post('/config',{key:key,value:on?'true':'false'}).then(function(d){if(d.error){alert(d.error);showFlags()}})}
</script>
</body>
</html>
